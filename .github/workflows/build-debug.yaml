name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  NAME_PREFIX: senboard-debug

jobs:
  build-debug:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get app version
        run: |
          if SENBOARD_VERSION=$(cat app/build.gradle.kts | awk '/versionName/ { print $3 }' | sed 's/"//g'); then
            echo "SENBOARD_VERSION=$SENBOARD_VERSION" >> $GITHUB_ENV
            echo "Found version: $SENBOARD_VERSION"
          else
            echo "SENBOARD_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.NAME_PREFIX }}-${{ env.SENBOARD_VERSION }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9
          retention-days: 30
          overwrite: true
