name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: shortSha
        run: echo "shortSha=$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT"

      - name: Get app version
        id: appVersion
        run: |
          SENBOARD_VERSION=$(cat app/build.gradle.kts | awk '/versionName/ { print $3 }' | sed 's/"//g')
          echo "senboardVersion=$SENBOARD_VERSION >> $GITHUB_OUTPUT"
          echo "Found version: $SENBOARD_VERSION"

      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: senboard-debug-${{ steps.appVersion.outputs.senboardVersion }}-${{ steps.shortSha.outputs.shortSha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9
          retention-days: 30
          overwrite: true
