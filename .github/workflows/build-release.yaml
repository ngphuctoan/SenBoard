name: Build Release

on:
  workflow_dispatch:
  push:
    tags: [ "*" ]

env:
  NAME_PREFIX: senboard-release
  KEYSTORE_STORE_FILE_NAME: release-key.jks

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get release name
        run: |
          if SENBOARD_VERSION=$(cat app/build.gradle.kts | awk '/versionName/ { print $3 }' | sed 's/"//g'); then
            echo "SENBOARD_VERSION=$SENBOARD_VERSION" >> $GITHUB_ENV
            echo "Found version: $SENBOARD_VERSION"
          else
            echo "SENBOARD_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Get signing information
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_STORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
        run: |
          # Get absolute path of release key first
          KEYSTORE_STORE_FILE_PATH=$(realpath $KEYSTORE_STORE_FILE_NAME)
          echo "::add-mask::$KEYSTORE_STORE_FILE_PATH"
          echo "KEYSTORE_STORE_FILE_PATH=$KEYSTORE_STORE_FILE_PATH" >> $GITHUB_ENV
          
          # Then actually get the release key content
          echo $KEYSTORE_STORE_FILE | base64 -d > $KEYSTORE_STORE_FILE_PATH
          
          # Finally construct the properties file for Gradle to use
          cat > keystore.properties << EOF
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          storeFile=$KEYSTORE_STORE_FILE_PATH
          EOF

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease
          
          # Move it out to project directory and rename it for easier access
          mv app/build/outputs/apk/release/app-release.apk $NAME_PREFIX-$SENBOARD_VERSION.apk

      - name: Delete signing information
        run: rm $KEYSTORE_STORE_FILE_PATH

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.NAME_PREFIX }}-${{ env.SENBOARD_VERSION }}
          path: ${{ env.NAME_PREFIX }}-${{ env.SENBOARD_VERSION }}.apk
          compression-level: 9
          retention-days: 7
          overwrite: true

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: Release ${{ env.SENBOARD_VERSION }}
          files: ${{ env.NAME_PREFIX }}-${{ env.SENBOARD_VERSION }}.apk
          generate_release_notes: true
