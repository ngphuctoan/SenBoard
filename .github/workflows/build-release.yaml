name: Build Release

on:
  workflow_dispatch:
  push:
    tags: [ "*" ]

env:
  RELEASE_NAME: senboard-release-${{ github.ref_name }}

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get signing information
        run: |
          # Get absolute path of release key first
          KEYSTORE_STORE_FILE_PATH=$(realpath release-key.jks)
          echo "::add-mask::$KEYSTORE_STORE_FILE_PATH"
          echo "KEYSTORE_STORE_FILE_PATH=$KEYSTORE_STORE_FILE_PATH" >> $GITHUB_ENV
          
          # Then actually get the release key content
          echo $KEYSTORE_STORE_FILE | base64 -d > $KEYSTORE_STORE_FILE_PATH
          
          # Finally construct the properties file for Gradle to use
          cat > keystore.properties << EOF
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          storeFile=$KEYSTORE_STORE_FILE_PATH
          EOF

      - name: set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease
          
          # Move it out to project directory and rename it for easier access
          mv app/build/outputs/apk/release/app-release.apk $RELEASE_NAME.apk

      - name: Delete signing information
        run: rm $KEYSTORE_STORE_FILE_PATH

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.RELEASE_NAME }}.apk
          compression-level: 9
          retention-days: 7
          overwrite: true

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: Release ${{ github.ref_name }}
          files: ${{ env.RELEASE_NAME }}.apk
          generate_release_notes: true
